[package]
name = "rust-blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.1", features = ["use-std"] }
data-encoding = "2.11.1"
num-bigint = "0.5.1"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sled = "0.34"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.4"
